<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>TechSolutions - Gestão de Cobrança</title>

    <style>
        body {
            margin: 0;
            background: linear-gradient(to right, #007BFF, #00AEEF);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 800px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
        }

        h2 { color: #007BFF; }

        input, select, textarea {
            width: 90%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 93%;
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background: #0056b3; }

        .btn-pdf { background: #dc3545; margin-top: 10px; }
        .btn-pdf:hover { background: #a71d2a; }

        .btn-list { background: #28a745; margin-top: 10px; }
        .btn-list:hover { background: #1e7e34; }

        .erro { color: #dc3545; }
        .sucesso { color: #28a745; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            text-align: left;
        }
        .full-width { grid-column: span 2; }
    </style>
</head>

<body>

    <div class="container">
        <h1>TechSolutions Ltda</h1>

        {% if messages %}
        {% for message in messages %}
        <p class="{% if message.tags == 'error' %}erro{% else %}sucesso{% endif %}">
            {{ message }}
        </p>
        {% endfor %}
        {% endif %}

        <div class="section">
            <h2>Cadastro de Cliente</h2>
            <form method="post">
                {% csrf_token %}
                <div class="form-grid">
                    <input type="text" name="nome" placeholder="Nome Completo" required>
                    <input type="text" name="cpf" placeholder="CPF (somente números)" required>
                    <input type="email" name="email" placeholder="E-mail" required>
                    <input type="text" name="telefone" placeholder="Telefone (DDD + Número)" required>
                    <textarea name="endereco" placeholder="Endereço Completo" class="full-width" rows="2"></textarea>
                </div>
                <button type="submit" name="acao" value="cadastrar">Cadastrar Cliente</button>
            </form>
        </div>

        <div class="section">
            <h2>Emissão de Fatura</h2>
            <form method="post">
                {% csrf_token %}
                <div class="form-grid">
                    <select name="cliente_id" required>
                        <option value="">Selecione um Cliente</option>
                        {% for cliente in clientes %}
                        <option value="{{ cliente.id }}">{{ cliente.nome }} ({{ cliente.cpf }})</option>
                        {% endfor %}
                    </select>
                    <input type="number" step="0.01" name="valor" placeholder="Valor (R$)" required>
                    <input type="date" name="data_vencimento" required class="full-width">
                </div>
                <button type="submit" name="acao" value="gerar_fatura">Gerar Fatura</button>
            </form>
        </div>

        <div class="section">
            <h2>Ações Rápidas</h2>
            <a href="{% url 'listagem_faturas' %}"><button class="btn-list">📋 Listar Faturas</button></a>
            <form method="post">
                {% csrf_token %}
                <button type="submit" name="acao" value="gerar_pdf_em_lote" class="btn-pdf">📄 Gerar PDFs em Lote</button>
            </form>
        </div>
    </div>

</body>

</html>
